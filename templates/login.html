{% extends "base.html" %}

{% block title %}Login - Balitech Feedback System{% endblock %}

{% block content %}
<div class="container-fluid d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="row w-100">
        <div class="col-md-5 col-lg-4 mx-auto">
            <!-- Login Card -->
            <div class="card" style="border: none; box-shadow: 0 4px 16px rgba(0,0,0,0.08);">
                <div class="card-body p-5">
                    <!-- Header -->
                    <div class="text-center mb-4">
                        <h2 class="mb-2" style="color: var(--text-dark); font-weight: 700;">Balitech</h2>
                        <h5 class="text-muted mb-3">Feedback System</h5>
                        <p class="text-muted small">Login to create and manage your forms</p>
                    </div>

                    <hr class="my-4">

                    <!-- Login Form -->
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-500" style="color: var(--text-dark);">Username</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required style="border-color: #e5e7eb;">
                        </div>
                        
                        <div class="mb-4">
                            <label for="password" class="form-label fw-500" style="color: var(--text-dark);">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required style="border-color: #e5e7eb;">
                        </div>
                        
                        <!-- Alerts -->
                        <div id="alertContainer" class="mb-3"></div>
                        
                        <!-- Login Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg fw-600">Login</button>
                        </div>
                    </form>

                    <hr class="my-4">

                    <!-- Footer -->
                    <div class="text-center">
                        <p class="text-muted mb-2">Don't have an account?</p>
                        <a href="{{ url_for('auth.register') }}" class="btn btn-outline-primary btn-sm w-100">Create Account</a>
                    </div>

                    <div class="text-center mt-4">
                        <a href="{{ url_for('forms.list_public_forms') }}" class="text-muted text-decoration-none small">← Back to Forms</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const alertContainer = document.getElementById('alertContainer');
        
        try {
            const response = await fetch('{{ url_for("auth.login") }}', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();
            
            if (response.ok) {
                alertContainer.innerHTML = `
                    <div class="alert alert-success alert-dismissible fade show" role="alert">
                        Login successful! Redirecting...
                    </div>
                `;
                setTimeout(() => {
                    window.location.href = data.redirect || '{{ url_for("forms.list_public_forms") }}';
                }, 1000);
            } else {
                const errorMessage = data.message || 'Login failed. Please try again.';
                alertContainer.innerHTML = `
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <strong>Error!</strong> ${errorMessage}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                `;
            }
        } catch (error) {
            alertContainer.innerHTML = `
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <strong>Error!</strong> ${error.message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }
    });
</script>
{% endblock %}
