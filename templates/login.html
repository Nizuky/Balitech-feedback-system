{% extends "base.html" %}

{% block title %}Creator Login - Balitech Feedback System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body p-5">
                <h2 class="card-title text-center mb-4">Balitech Feedback System</h2>
                <h5 class="card-subtitle text-center mb-5 text-muted">Creator Login</h5>
                
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    
                    <div id="alertContainer"></div>
                    
                    <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
                </form>
                
                <p class="text-center text-muted">Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a></p>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        try {
            const response = await fetch('{{ url_for("auth.login") }}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            });

            const rawBody = await response.text();
            let data;
            try {
                data = JSON.parse(rawBody);
            } catch (_parseErr) {
                data = { message: `Server returned non-JSON response (status ${response.status}).` };
            }

            const alertContainer = document.getElementById('alertContainer');
            
            if (response.ok) {
                alertContainer.innerHTML = `<div class="alert alert-success">Login successful! Redirecting...</div>`;
                setTimeout(() => {
                    window.location.href = data.redirect;
                }, 1500);
            } else {
                const errorMessage = data.message || `Login failed (HTTP ${response.status}).`;
                alertContainer.innerHTML = `<div class="alert alert-danger">${errorMessage}</div>`;
            }
        } catch (error) {
            document.getElementById('alertContainer').innerHTML = `<div class="alert alert-danger">Request failed: ${error.message}</div>`;
        }
    });
</script>
{% endblock %}
